<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | API Monitor</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Project CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="login-page">


    <div class="login-wrapper">


        <!-- ================================================
             LOGIN BRAND
             ================================================ -->

        <div class="login-brand">


            <div class="login-brand-icon">

                <i class="bi bi-shield-check"></i>

            </div>


            <h1>
                API MONITOR
            </h1>


            <p>
                Monitoring & Alerting System
            </p>


        </div>


        <!-- ================================================
             LOGIN CARD
             ================================================ -->

        <div class="login-card">


            <div class="login-card-header">

                <h2>
                    Administrator Login
                </h2>

                <p>
                    Sign in to access the monitoring dashboard
                </p>

            </div>


            <!-- Error Message -->

            {% if error %}

                <div class="login-error">

                    <i class="bi bi-exclamation-circle"></i>

                    <span>
                        {{ error }}
                    </span>

                </div>

            {% endif %}


            <!-- Login Form -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
            >


                <!-- Username -->

                <div class="login-form-group">

                    <label for="username">
                        Username
                    </label>


                    <div class="login-input-wrapper">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="login-form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="login-input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            aria-describedby="password-toggle"
                        >

                        <button
                            type="button"
                            class="login-password-toggle"
                            id="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password"
                        >
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>

                    </div>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-button"
                >

                    <i class="bi bi-box-arrow-in-right"></i>

                    <span>
                        Login
                    </span>

                </button>


            </form>


        </div>


        <!-- Footer -->

        <div class="login-footer">

            <i class="bi bi-shield-check"></i>

            Secure Administrator Access

        </div>


    </div>


<script>
    (() => {
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('password-toggle');
        const icon = toggleButton.querySelector('i');

        toggleButton.addEventListener('click', () => {
            const showPassword = passwordInput.type === 'password';
            passwordInput.type = showPassword ? 'text' : 'password';
            toggleButton.setAttribute('aria-pressed', String(showPassword));
            toggleButton.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
            toggleButton.title = showPassword ? 'Hide password' : 'Show password';
            icon.className = showPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            passwordInput.focus();
        });

        // Always mask the password when the login form is submitted.
        passwordInput.form.addEventListener('submit', () => {
            passwordInput.type = 'password';
        });
    })();
</script>

</body>

</html>
