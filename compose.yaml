services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-api_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-api_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-api_monitoring}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "init_db.py"]
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-api_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-api_monitoring}
    ports:
      - "5000:5000"
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-api_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-api_monitoring}
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["python", "scheduler_runner.py"]

volumes:
  postgres_data:
